name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.1.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "AG Client v2.1.0 - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.1.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.1.0:
            - **Fixed Module Crosstalk & Auto-Off Bug:** Resolved Compose LazyColumn index recycling bug causing Fly and KillAura toggle collisions. All module toggles now mutate reactive state directly and persist immediately to disk, preventing resets when switching tabs or reopening the app.
            - **Eliminated Connection Timed Out:** Fixed upstream handshake stalls by properly forwarding `ServerToClientHandshakePacket`. Handled blank target servers with an immediate, clear disconnect message instead of a 30-second silent timeout.
            - **Permanent Loopback IP (127.0.0.1):** Highlighted `127.0.0.1:19133` so your Minecraft server list entry never needs updating when switching between Wi-Fi and Mobile Data. Added 1-tap Copy IP & Port buttons.
            - **Minecraft 1.21+ (Ore UI) Play Screen Guide:** Updated connection instructions with exact sidebar icon steps (Servers icon 🖥️ and Friends icon 👥) for Minecraft Bedrock 1.21+.
            - **Duplicate App Cleanup:** Auto-detects older legacy installations (`com.aayaan.agclient.debug`) and provides a 1-tap uninstaller so you never have duplicate app icons on your phone.
            - **Seamless Auto-Updater:** In-app updates now seamlessly support all major, minor, and patch releases (e.g., 2.0.1, 2.1.0, 2.2.0) with consistent keystore verification.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
