name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.8.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.8.0
          name: "AG Client v2.8.0 - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.8.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.8.0:
            - **MitM Packet Manager & Full Key Exchange Engine:** Full bi-directional packet interceptor with dynamic ECDH (secp384r1/secp256r1) key derivation and AES cipher activation for both Minecraft and remote servers.
            - **End-to-End Interception & Encryption Bridge:** Eliminates multiplayer connection timeouts and "Connection failed" drops by terminating encryption handshakes on both legs.
            - **Resilient Multi-Port Proxy Listener:** Dynamic candidate port binding with re-entrancy protection and `SO_REUSEADDR` to prevent `BindException: Address already in use`.
            - **Virtual Sandbox Per-App Routing (10.0.0.1:19133 & 19132):** Restored native Minecraft package filtering (`com.mojang.minecraftpe`, etc.) with dynamic relay port routing.
            - **One-Tap Console Log Copying & Diagnostics:** Instant log copy to clipboard directly from the console interface.
            - **70+ In-Game Commands & Utilities:** Complete combat, movement, visual, and world utility suite.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
