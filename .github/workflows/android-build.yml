name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.5.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0
          name: "AG Client v2.5.0 - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.5.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.5.0:
            - **Virtual Sandbox Router (10.0.0.1):** Isolated local network sandbox on your phone. Eliminates connection timeouts on SIM Net/mobile data and Wi-Fi without carrier interference.
            - **Full Internet Retention in Sandbox:** Minecraft retains 100% full internet connectivity for Xbox Live, Microsoft authentication, skins, and Marketplace.
            - **In-Game Join Welcome & Attribution:** Displays private client message on server join: "AG Client v2.5.0 - Made by Aayaan Ghosh" with prompts to run `.help`.
            - **Lunar-Style Chat Commands:** `.help`, `/help`, `.cmds`, `/commands` prints all 70 commands categorized directly in chat text (no modal GUI).
            - **Dynamic Quick Connect Card:** Automatically switches between Virtual Sandbox IP (10.0.0.1) and Local Loopback (127.0.0.1) or Wi-Fi IP with 1-tap copy.
            - **Zero Default/Hardcoded Servers:** No preset or featured server chips. History strictly records user-joined servers.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
