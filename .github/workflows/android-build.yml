name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master", "connection-test" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master", "connection-test" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.9.8-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/connection-test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.8
          name: "AG Client v2.9.8 - Persistent KeyPair, 90-Day Auth Lifecycle & Console Auth Diagnostics"
          body: |
            ### AG Client v2.9.8 (Persistent KeyPair, 90-Day Auth & Diagnostics)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.9.8:
            - **Persistent Device KeyPair Architecture:** AG Client securely generates and persists one permanent EC KeyPair (secp384r1) on the device, ensuring the Mojang-signed certificate chain and private key match 100% on every connection.
            - **90-Day Account Session Tracking & Auto-Refresh:** Tracks your login session for 90 days with background silent token renewal. If not used for days, it automatically refreshes tokens in the background without needing browser re-entry. Prompts re-login after 90 days.
            - **Dedicated Console Auth Diagnostic Tool:** Added "Run Auth Diagnostic" in Console to test Microsoft Refresh Token, Xbox/XSTS Token, Mojang Endpoint HTTP 200, and cryptographic key signatures in real time.
            - **Protocol 2193 Dynamic Codec Auto-Synthesis:** Dynamically synthesizes and matches client protocol version (including Protocol 2193 / Minecraft 1.26.50+), resolving handshake deserialization drops and InitialConnection 90 errors.
            - **Exact Minecraft Skin & Model Preservation:** Extracts the player's custom skin, cape, 3D geometry model, and animations directly from the local Minecraft app and re-signs it for the outbound session.
            - **Account Management UI:** Monospace device code display, Copy Code, Copy Link, Open Link browser launcher, and Account Removal with confirmation dialog.
            - **Unlimited Rate-Limit Free Auto-Updater:** Bypasses GitHub API 403 limits using Fastly CDN and web redirects.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
