name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-Beta-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-beta
          name: "AG Client Beta - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (Beta v1.0.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### Core Features:
            - **Local RakNet Listener:** Runs on `127.0.0.1:19132` with auto LAN BedrockPong broadcasting.
            - **Microsoft OAuth 2.0 Auth:** Device Code flow token chain integration & Xbox Live authentication.
            - **In-Game Modal Form GUI:** Native Bedrock UI menu (`/gui`, `/menu`, `.gui`).
            - **Zero Public Leak Rule:** Complete interception & suppression of proxy commands (`.` and `/`).
            - **5 Module Categories & 28+ Modules:**
              - *Combat:* KillAura, Reach, Hitbox, AutoClicker, TriggerBot, TpAura, AutoCrystal, AnchorAura, AutoTotem, Knockback, Backtrack, ShieldDisabler, MaceSwap
              - *Movement:* Fly, Speed, Phase, Jetpack, BoatFly, NoSlow, Step, WaterWalk, AirJump
              - *Visual:* Xray, PlayerESP, ItemESP, Tracers, Freecam, ChunkFinder, HoleESP, NoInvisible
              - *World:* Scaffold, Nuke/AutoDig, AutoMine, AutoToolSwap, FastInteract
              - *Utility:* Gui, Config, Ghost Mode
            - **Jetpack Compose Native UI:** Material 3 dark cybernetic dashboard with live packet log console.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
