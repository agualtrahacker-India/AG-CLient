name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master", "connection-test" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master", "connection-test" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi
          # Ensure both naming conventions exist in release directory for universal updater compatibility
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/AG-Client-v2.9.9-release.apk || true

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.9.9-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/connection-test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.9
          name: "AG Client v2.9.9 - Auth Pipeline Hardening, Auto-Updater Fix & Console Diagnostics"
          body: |
            ### AG Client v2.9.9 (Auth Pipeline Hardening, Auto-Updater Fix & Diagnostics)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.9.9:
            - **Authentication Pipeline Hardening:** Eliminated race conditions by pre-fetching the official Mojang certificate chain upon app and proxy startup. Awaits chain readiness before forwarding `LoginPacket` upstream, guaranteeing no unauthenticated packet leaks.
            - **Handshake Cryptography Fix (JOSE ES384 Format):** Corrected the ECDH `ServerToClientHandshakePacket` JWS signature from raw ASN.1 DER to the standard 96-byte JOSE (R||S) format required by vanilla Minecraft Bedrock, ensuring the client successfully verifies the handshake and activates AES encryption.
            - **Multi-Layer Client Key Extraction:** Implemented resilient multi-reflection inspection over CloudburstMC `LoginPacket` structures (handling `AsciiString`, `ByteBuf`, `List`, and raw JSON chains), correctly extracting the client's actual public key from the identity claim token rather than the CA root.
            - **Auto-Updater Overhaul:** Fixed 404 download failures with automatic dual-URL fallback (`app-release.apk` & `AG-Client-v2.9.9-release.apk`). Full support for HTTP 301, 302, 303, 307, and 308 redirects with refreshed headers.
            - **Android 8–16 Package Installer Permissions:** Added explicit checking for `canRequestPackageInstalls()`, prompting the user directly to system settings if unknown sources are disabled, and saving downloads to external storage with broad FileProvider URI grants.
            - **Console Updater & Auth Diagnostics:** Run one-tap live diagnostic probes for Xbox Live tokens, Mojang endpoint, storage write permissions, and package installer configuration directly from the Console tab.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
