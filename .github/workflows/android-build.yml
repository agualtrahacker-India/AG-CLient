name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.4.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.4.0
          name: "AG Client v2.4.0 - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.4.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.4.0:
            - **Intelligent Network Detection (SIM Net vs Wi-Fi):** Fixed bug where cellular connections were mislabeled as Wi-Fi. Accurately identifies Cellular Data vs Wi-Fi LAN using Android's `ConnectivityManager`.
            - **SIM Net / Mobile Data Support:** Detects cellular data and guides connection via `127.0.0.1:19133`, avoiding carrier CGNAT self-loopback drops, with 1-tap copy and in-game "Use Cellular Data" requirement guide.
            - **Zero Default/Hardcoded Servers:** No preset or featured server chips. The user has 100% control over target IPs. Server history only records servers the user actually joins.
            - **No More 30-Second Silent Hangs:** Instant Netty timeout handling and immediate descriptive disconnect messages if target server is unreachable or offline.
            - **Keyed Compose Modules & Instant Disk Persistence:** Zero toggle crosstalk (e.g. Fly vs KillAura) and state resets when changing tabs.
            - **Duplicate App Cleanup:** Auto-detects legacy installations (`com.aayaan.agclient.debug`) with a 1-tap uninstaller.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
