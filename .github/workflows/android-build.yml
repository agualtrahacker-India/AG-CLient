name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master", "connection-test" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master", "connection-test" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.9.7-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/connection-test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.7
          name: "AG Client v2.9.7 - Protocol 2193 Auto-Synthesis, Official Xbox Auth & Exact Skin Preservation"
          body: |
            ### AG Client v2.9.7 (Protocol 2193 Auto-Synthesis & Upstream Handshake)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.9.7:
            - **Protocol 2193 Dynamic Codec Auto-Synthesis:** Dynamically synthesizes and matches any client protocol version (including Protocol 2193 / Minecraft 1.26.50+), resolving the handshake deserialization drop and InitialConnection 90 errors.
            - **Seamless Upstream Handshake Synchronization:** Properly synchronizes NetworkSettingsPacket and LoginPacket forwarding between client and remote servers.
            - **Official Microsoft & Xbox Live Auth for The Hive:** One-tap device code linking generates valid Mojang-signed certificate chains matched to proxy ECDH keys, solving the "Authentication Required" kick on featured servers.
            - **Exact Minecraft Skin & Model Preservation:** Extracts the player's custom skin, cape, 3D geometry model, and animations directly from the local Minecraft app and re-signs it for the outbound session.
            - **Account Management UI:** Added Copy Code, Copy Link, Open Link browser launcher, and Account Removal with confirmation dialog.
            - **Cellular & SIM Net Connectivity Guidance:** Enhanced in-app detection and guidance for mobile data users to toggle Minecraft's "Use Cellular Data" setting.
            - **Dual Transport Testing:** RakNet UDP + NetherNet port 7551 discovery & companion TCP listeners.
            - **Unlimited Rate-Limit Free Auto-Updater:** Bypasses GitHub API 403 limits using Fastly CDN and web redirects.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
