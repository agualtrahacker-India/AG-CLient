name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.0-beta-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-beta
          name: "AG Client v2.0-beta - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.0-beta)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### v2.0-beta Highlights:
            - **Port 19133 Default:** Binds to UDP port `19133` avoiding Android Minecraft 19132 LAN conflicts.
            - **Consistent Developer Signature:** All APKs are consistently signed with the permanent release keystore for seamless in-app auto-updating without signature conflicts.
            - **Persistent Server History:** All joined servers are automatically remembered and preserved across app updates with 1-tap switching.
            - **Live Server Reachability Checker:** Ping and verify target Bedrock servers in real-time before joining.
            - **Background Persistence:** High-performance `WifiLock`, `WakeLock`, and ongoing notification prevent Android OS termination.
            - **Full 70 Modules & Commands Suite:** Complete coverage of all Combat, Movement, Visual, World, and Core utility modules.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
