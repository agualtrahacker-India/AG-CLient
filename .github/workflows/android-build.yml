name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.7.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.7.0
          name: "AG Client v2.7.0 - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.7.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.7.0:
            - **Fixed Port BindException & Re-entrancy Guard:** Resolved `java.net.BindException: Address already in use` with `SO_REUSEADDR`, atomic duplicate bind protection, and kernel socket release on stop.
            - **One-Tap Console Log Copying:** Added instant "Copy" button in Packet & System Console view with Android clipboard integration and clear action.
            - **Multiplayer Handshake & Packet Pipe Resilience:** Wrapped packet processing pipeline in isolated exception guards to ensure unexpected packets never drop multiplayer sessions.
            - **Native Servers Tab Virtual Sandbox (10.0.0.1:19133):** Built specifically for modern Minecraft Bedrock 1.21+ New Play Screen (Ore UI).
            - **Automated 30-Minute Background Updates:** Silent background updates with rate-limit protection and system notifications.
            - **70+ In-Game Commands & Utilities:** Complete combat, movement, visual, and world utility suite.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
