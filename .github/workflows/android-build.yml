name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master", "connection-test" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master", "connection-test" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.9.0-beta.1-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/connection-test'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.9.0-beta.1
          name: "AG Client v2.9.0-beta.1 - Connection Test & Advanced Diagnostics"
          body: |
            ### AG Client (v2.9.0-beta.1 - Connection Test)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.9.0-beta.1:
            - **Branch connection-test & Dedicated Beta 1 Diagnostics Build:** Specifically isolated test environment to diagnose Android sandbox and remote server connectivity.
            - **RakNet Packet Inspector & Live Hex Telemetry:** Real-time decoding of RakNet datagrams (0x05, 0x06, 0x07, 0x08, 0x09, 0x10, 0x13, 0x19, 0x1c) on tun0 and relay sockets.
            - **Integrated In-App Connectivity Test Suite:** "Run Network Diagnostic" tests local proxy port 127.0.0.1:19133, DNS lookup latency, and direct RakNet UDP ping to target server.
            - **Interactive User Response Feedback & Diagnostic Bundle:** One-tap feedback reporting ("Working", "Stuck: External Server", "Stuck: Multiplayer", "Timed Out") and comprehensive report copying.
            - **Dual Transport Testing (RakNet & NetherNet WebRTC/TCP):** Added NetherNet LAN listener on UDP port 7551, companion NetherNet TCP signaling listener, and STUN/DTLS packet telemetry alongside classic RakNet.
            - **Unlimited Rate-Limit Free Auto-Updater:** Replaced rate-limited GitHub REST API checks with GitHub Web Redirect and Fastly CDN version.json checks for unlimited checks.
            - **Non-blocking Upstream Dispatcher:** Upstream DNS and bootstrap connection runs on IO coroutine dispatcher, preventing Netty thread stalls.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
