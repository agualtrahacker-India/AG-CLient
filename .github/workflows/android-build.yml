name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.2.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0
          name: "AG Client v2.2.0 - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.2.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.2.0:
            - **Adopted Lunar Proxy Domain Trick (`play.localtest.me`):** Replaced raw numeric loopback IP with a verified website domain (`play.localtest.me`), completely bypassing Minecraft Bedrock Android's raw loopback connection block.
            - **Removed Method 2 (Friends / LAN Tab):** Streamlined setup to 1 single, reliable connection method (Add Server). Removed background broadcast socket contention.
            - **1-Tap Featured Server Quick-Selector:** Added instant preset chips for The Hive, NetherGames, CubeCraft, Lifeboat, and Zeqa right on the dashboard.
            - **Fixed Module Crosstalk & Auto-Off Bug:** All module toggles now persist immediately to disk and use keyed LazyColumn Compose states, preventing toggle collisions and resets.
            - **Eliminated Connection Timed Out:** Forwarded upstream handshake packets properly and added immediate descriptive disconnection if target host is invalid.
            - **Legacy Duplicate App Cleanup:** Auto-detects legacy installations (`com.aayaan.agclient.debug`) and provides a 1-tap uninstaller.
            - **Full Semantic Version Auto-Updater:** Seamless in-app updating across all version tiers signed with the permanent release keystore.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
