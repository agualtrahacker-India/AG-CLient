name: AG Client Build & Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon 2>&1 | tee gradle-build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "::error::Gradle build failed. Showing error details:"
            grep -E "e: |FAILURE:|Caused by:|Compilation error|unresolved reference" -C 3 gradle-build.log || tail -n 120 gradle-build.log
            exit 1
          fi

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: |
            app/build/reports/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AG-Client-v2.3.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.0
          name: "AG Client v2.3.0 - Standalone Minecraft Bedrock Proxy"
          body: |
            ### AG Client (v2.3.0)
            Standalone Minecraft Bedrock MITM Proxy for Android.
            
            #### What's New in v2.3.0:
            - **No Default or Hardcoded Servers:** Completely removed all preset/featured server chips and hardcoded IPs. The user has full control to enter any destination server. Only servers the user actually joins are saved in history.
            - **Eliminated Connection Timed Out Root Cause:** Added explicit Netty connection timeout handling, direct disconnection errors on remote failure (no more 30-second silent hangs), and live Wi-Fi IP auto-detection with 1-tap refresh.
            - **Clean One-Method Connection:** Fast, direct "Add Server" in Minecraft using the phone's live IP and default port 19133.
            - **Keyed Compose Modules & Instant Persistence:** Prevents toggle crosstalk (e.g. Fly vs KillAura) and state resets when changing tabs.
            - **Duplicate App Cleanup:** Auto-detects legacy installations (`com.aayaan.agclient.debug`) and provides a 1-tap uninstaller.
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
